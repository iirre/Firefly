backend:
  name: github
  repo: iirre/Firefly
  branch: master
  base_url: https://firefly-auth.acgr18share.workers.dev
  auth_endpoint: /auth
  app_id: Ov23li3oBf88QVLbFeUb
media_folder: public/assets/cms
public_folder: /assets/cms
collections:
- name: posts
  label: 文章
  folder: src/content/posts
  create: true
  slug: '{{slug}}'
  extension: md
  format: frontmatter
  fields:
  - label: 标题
    name: title
    widget: string
  - label: 发布日期
    name: published
    widget: datetime
    format: YYYY-MM-DD
    date_format: YYYY-MM-DD
    time_format: false
  - label: 置顶
    name: pinned
    widget: boolean
    required: false
    default: false
  - label: 描述
    name: description
    widget: text
    required: false
  - label: 标签
    name: tags
    widget: list
    required: false
  - label: 分类
    name: category
    widget: string
    required: false
  - label: 封面图
    name: image
    widget: image
    required: false
  - label: 别名
    name: slug
    widget: string
    required: false
  - label: 正文
    name: body
    widget: markdown
- name: settings
  label: 网站设置
  files:
  - name: site
    label: 站点信息
    file: src/data/cms/site.json
    fields:
    - label: 站点标题
      name: title
      widget: string
    - label: 副标题
      name: subtitle
      widget: string
    - label: 站点描述
      name: description
      widget: text
    - label: 关键词
      name: keywords
      widget: list
  - name: profile
    label: 个人资料
    file: src/data/cms/profile.json
    fields:
    - label: 头像
      name: avatar
      widget: image
      required: false
    - label: 名字
      name: name
      widget: string
    - label: 签名
      name: bio
      widget: text
    - label: 社交链接
      name: links
      widget: list
      fields:
      - label: 名称
        name: name
        widget: string
      - label: 图标
        name: icon
        widget: string
        hint: 如 fa7-brands:github，见 icones.js.org
      - label: 链接
        name: url
        widget: string
      - label: 显示名称
        name: showName
        widget: boolean
        default: false
  - name: announcement
    label: 公告
    file: src/data/cms/announcement.json
    fields:
    - label: 公告标题（空则用默认）
      name: title
      widget: string
      required: false
    - label: 公告内容
      name: content
      widget: text
    - label: 允许关闭
      name: closable
      widget: boolean
      default: true
    - label: 链接
      name: link
      widget: object
      fields:
      - label: 启用
        name: enable
        widget: boolean
        default: false
      - label: 文本
        name: text
        widget: string
        required: false
      - label: 地址
        name: url
        widget: string
        required: false
      - label: 外部链接
        name: external
        widget: boolean
        default: false
  - name: music
    label: 音乐播放器
    file: src/data/cms/music.json
    fields:
    - label: 导航栏显示
      name: showInNavbar
      widget: boolean
      default: true
    - label: 侧边栏显示
      name: showInSidebar
      widget: boolean
      default: true
    - label: 模式
      name: mode
      widget: select
      options:
      - local
      - meting
      default: local
      hint: local=本地列表，meting=在线API
    - label: 音量
      name: volume
      widget: number
      min: 0
      max: 1
      step: 0.1
      default: 0.7
    - label: 播放模式
      name: playMode
      widget: select
      options:
      - list
      - one
      - random
      default: list
      hint: list=列表循环 one=单曲循环 random=随机
    - label: 显示歌词
      name: showLyrics
      widget: boolean
      default: false
    - label: Meting API 配置
      name: meting
      widget: object
      collapsed: true
      fields:
      - label: API地址
        name: api
        widget: string
      - label: 平台
        name: server
        widget: select
        options:
        - netease
        - tencent
        - kugou
        - baidu
        default: netease
      - label: 类型
        name: type
        widget: select
        options:
        - song
        - playlist
        - album
        default: playlist
      - label: 歌单ID
        name: id
        widget: string
    - label: 本地歌单
      name: local
      widget: object
      fields:
      - label: 歌曲列表
        name: playlist
        widget: list
        fields:
        - label: 歌名
          name: name
          widget: string
        - label: 歌手
          name: artist
          widget: string
        - label: 音频文件
          name: url
          widget: file
          hint: 上传mp3到 public/assets/music/
        - label: 封面
          name: cover
          widget: image
          required: false
        - label: 歌词
          name: lrc
          widget: text
          required: false
  - name: friends
    label: 友链
    file: src/data/cms/friends.json
    fields:
    - label: 页面设置
      name: page
      widget: object
      collapsed: true
      fields:
      - label: 标题（空则用默认）
        name: title
        widget: string
        required: false
      - label: 描述（空则用默认）
        name: description
        widget: string
        required: false
      - label: 显示自定义内容
        name: showCustomContent
        widget: boolean
        default: true
      - label: 显示评论
        name: showComment
        widget: boolean
        default: true
      - label: 随机排序
        name: randomizeSort
        widget: boolean
        default: false
    - label: 友链列表
      name: list
      widget: list
      fields:
      - label: 名称
        name: title
        widget: string
      - label: 头像
        name: imgurl
        widget: image
      - label: 描述
        name: desc
        widget: text
      - label: 网址
        name: siteurl
        widget: string
      - label: 标签
        name: tags
        widget: list
        required: false
      - label: 权重（越大越靠前）
        name: weight
        widget: number
        default: 0
      - label: 启用
        name: enabled
        widget: boolean
        default: true
  - name: sponsor
    label: 打赏设置
    file: src/data/cms/sponsor.json
    fields:
    - label: 标题（空则用默认）
      name: title
      widget: string
      required: false
    - label: 描述（空则用默认）
      name: description
      widget: string
      required: false
    - label: 打赏用途说明
      name: usage
      widget: text
    - label: 显示打赏者列表
      name: showSponsorsList
      widget: boolean
      default: true
    - label: 显示评论区
      name: showComment
      widget: boolean
      default: true
    - label: 文章底部显示打赏按钮
      name: showButtonInPost
      widget: boolean
      default: true
    - label: 打赏方式
      name: methods
      widget: list
      fields:
      - label: 名称
        name: name
        widget: string
      - label: 图标
        name: icon
        widget: string
        hint: 如 fa7-brands:alipay
      - label: 收款码图片
        name: qrCode
        widget: image
        required: false
      - label: 跳转链接
        name: link
        widget: string
        required: false
      - label: 描述
        name: description
        widget: string
        required: false
      - label: 启用
        name: enabled
        widget: boolean
        default: true
  - name: gallery
    label: 相册管理
    file: src/data/cms/gallery.json
    fields:
    - label: 瀑布流列宽(px)
      name: columnWidth
      widget: number
      default: 240
    - label: 相册列表
      name: albums
      widget: list
      fields:
      - label: ID（对应 public/gallery/ 下目录名）
        name: id
        widget: string
      - label: 相册名称
        name: name
        widget: string
      - label: 描述
        name: description
        widget: text
        required: false
      - label: 地点
        name: location
        widget: string
        required: false
      - label: 日期
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        required: false
      - label: 标签
        name: tags
        widget: list
        required: false
      - label: 访问密码（空则公开）
        name: password
        widget: string
        required: false
      - label: 密码提示
        name: passwordHint
        widget: string
        required: false
  - name: comment
    label: 评论设置
    file: src/data/cms/comment.json
    fields:
    - label: 评论系统
      name: type
      widget: select
      options:
      - none
      - twikoo
      - waline
      - giscus
      - disqus
      - artalk
      default: none
    - label: Twikoo 配置
      name: twikoo
      widget: object
      collapsed: true
      fields:
      - label: 服务地址
        name: envId
        widget: string
      - label: 语言
        name: lang
        widget: string
        default: zh-CN
    - label: Waline 配置
      name: waline
      widget: object
      collapsed: true
      fields:
      - label: 服务地址
        name: serverURL
        widget: string
      - label: 语言
        name: lang
        widget: string
        default: zh-CN
    - label: Giscus 配置
      name: giscus
      widget: object
      collapsed: true
      fields:
      - label: 仓库
        name: repo
        widget: string
      - label: Repo ID
        name: repoId
        widget: string
      - label: 分类
        name: category
        widget: string
      - label: Category ID
        name: categoryId
        widget: string
    - label: Disqus 配置
      name: disqus
      widget: object
      collapsed: true
      fields:
      - label: Shortname
        name: shortname
        widget: string
    - label: Artalk 配置
      name: artalk
      widget: object
      collapsed: true
      fields:
      - label: 服务地址
        name: server
        widget: string
      - label: 站点名
        name: site
        widget: string
- name: pio
  label: 看板娘
  files:
  - name: spine
    label: Spine 模型
    file: src/data/cms/pio-spine.json
    fields:
    - label: 启用
      name: enable
      widget: boolean
      default: false
    - label: 模型
      name: model
      widget: object
      fields:
      - label: 模型路径
        name: path
        widget: string
      - label: 缩放
        name: scale
        widget: number
        min: 0.1
        max: 3
        step: 0.1
        default: 1.0
    - label: 位置
      name: position
      widget: object
      fields:
      - label: 角落
        name: corner
        widget: select
        options:
        - bottom-left
        - bottom-right
        - top-left
        - top-right
        default: bottom-left
      - label: 水平偏移
        name: offsetX
        widget: number
        default: 0
      - label: 垂直偏移
        name: offsetY
        widget: number
        default: 0
    - label: 尺寸
      name: size
      widget: object
      fields:
      - label: 宽度
        name: width
        widget: number
        default: 135
      - label: 高度
        name: height
        widget: number
        default: 165
  - name: live2d
    label: Live2D 模型
    file: src/data/cms/pio-live2d.json
    fields:
    - label: 启用
      name: enable
      widget: boolean
      default: false
    - label: 模型
      name: model
      widget: object
      fields:
      - label: 模型路径
        name: path
        widget: string
      - label: 缩放
        name: scale
        widget: number
        min: 0.1
        max: 3
        step: 0.1
        default: 1.0
    - label: 位置
      name: position
      widget: object
      fields:
      - label: 角落
        name: corner
        widget: select
        options:
        - bottom-left
        - bottom-right
        - top-left
        - top-right
        default: bottom-left
- name: wallpaper
  label: 背景壁纸
  files:
  - name: wallpaper
    label: 背景壁纸
    file: src/data/cms/wallpaper.json
    fields:
    - label: 模式
      name: mode
      widget: select
      options:
      - banner
      - full
      default: banner
      hint: banner=横幅模式 full=全屏背景
    - label: 启用壁纸切换器
      name: playerEnable
      widget: boolean
      default: true
    - label: 桌面壁纸
      name: desktop
      widget: image
      hint: 上传到 public/assets/ 下
    - label: 移动端壁纸
      name: mobile
      widget: image
      hint: 上传到 public/assets/ 下
- name: effects
  label: 特效
  files:
  - name: effects
    label: 特效
    file: src/data/cms/effects.json
    fields:
    - label: 樱花飘落特效
      name: enable
      widget: boolean
      default: false
    - label: 樱花数量
      name: sakuraNum
      widget: number
      min: 1
      max: 100
      default: 21
- name: banner
  label: 首页横幅
  files:
  - name: banner
    label: 首页横幅
    file: src/data/cms/banner.json
    fields:
    - label: 主标题
      name: title
      widget: string
    - label: 副标题（打字机轮播）
      name: subtitle
      widget: list
      hint: 每条一行，首页轮播显示
- name: license
  label: 文章许可
  files:
  - name: license
    label: 文章许可
    file: src/data/cms/license.json
    fields:
    - label: 启用
      name: enable
      widget: boolean
      default: true
    - label: 许可名称
      name: name
      widget: string
      hint: 如 CC BY-NC-SA 4.0
    - label: 许可链接
      name: url
      widget: string
